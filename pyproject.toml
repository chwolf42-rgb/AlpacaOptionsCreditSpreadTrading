[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-options-credit"
version = "0.1.0"
description = "Paper-only Alpaca options credit-spread bot (bull put / bear call). Sibling to equity and crypto bots; isolated credentials, journal, and loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlpacaOptionsCreditSpreadTrading" }]
dependencies = [
    "alpaca-py>=0.40.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alpaca-options-credit = "alpaca_options_credit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
