# AlpacaOptionsCreditSpreadTrading — default knobs.
# This is a sibling paper system to AlpacaTradingBots (equity) and
# AlpacaCryptoTrading (crypto). Do not point journal/heartbeat paths
# at those repos. Dedicated Alpaca paper account when keys arrive.

bot:
  name: alpaca-options-credit
  # Observer / dry-run: same signals + proposed strikes/credits, zero orders.
  # CLI --dry-run / `observe` overrides this to true.
  dry_run: true
  # Isolated runtime dir (heartbeat + sqlite). Never share with equity/crypto.
  var_dir: var/options
  log_level: INFO

# Locked playbook: daily + 1Hour hybrid. Not 1H-only and not 30Min.
# Daily owns trend bias (strict HH/HL or LL/LH), VP shelf, S/R, invalidation.
# 1Hour only times the first pullback into the *daily* zone and reconfirms trend.
# 1H dips do not cancel an arm; only a daily close through invalidation does.
timeframe:
  structure_bar: 1Day     # bias / VP / S/R / invalidation
  timing_bar: 1Hour       # pullback timing + 1H trend reconfirm
  swing_left: 2
  swing_right: 2
  atr_period: 14
  # Skip entry if last 1H close is extended this many *daily* ATRs past the zone.
  no_chase_atr: 0.5
  volume_profile:
    # Daily sessions (not 1H bars). Locked lookback is ~20–30 sessions.
    lookback_bars: 25
    bin_size: 0.50          # dollars; raise for indexes if shelves are too tight
    hvn_percentile: 0.70    # bins at/above this volume percentile are HVN
  # Counted in *daily structure bars* after confirm_index — not 1H bars and
  # not calendar days. Keep market_data.daily_bar_lookback larger than this
  # so the confirm bar stays in the fetch window (a sliding window would
  # shift the stored index). 10 daily bars ≈ two trading weeks.
  arm_timeout_bars: 10

universe:
  file: config/universe.yaml
  # day1 (10 megas/indexes) | full_a (57-name liquidity tier A).
  # List swap only — no code change. Paper dry-run is on full_a (57 names).
  # day1 remains available to shrink the sleeve.
  active: full_a

structures:
  # Locked playbook: these two credit spreads only.
  allow:
    - bull_put_credit     # bullish
    - bear_call_credit    # bearish

spreads:
  width: 5.00                 # 2.50 or 5.00
  dte_min: 30
  dte_max: 45
  min_credit_pct_of_width: 0.20   # skip if credit < ~20% of width
  # Conservative fillable credit = short bid − long ask (not mid).
  credit_from: natural
  multiplier: 100
  # Alpaca mleg limit_price is signed: negative = credit received.
  # Entries use day TIF; options extended_hours is always false.
  time_in_force: day

exits:
  # HARD LOCK: options-native software exits only. This sleeve never attaches
  # equity-style OCO / bracket / stop-limit working orders (held OCO legs,
  # pending_cancel qty limbo, cancel-before-replace naked windows, qty=60 vs
  # leftover tranche fights). Engine + load_config refuse those keys.
  path: credit_mark_and_structure
  forbid_equity_oco_bracket: true
  never_cancel_working_close: true
  # Atomic spread close only — no legging out. Open and close are one
  # 2-leg mleg. Never close/cancel only the long or only the short of a
  # healthy book (naked short → margin call). A leftover residual after a
  # broken mleg is a CRITICAL flatten, not a normal exit.
  atomic_spread_only: true
  # TP / stop are mark-to-close vs the credit received (not an equity R-ladder).
  take_profit_frac_of_credit: 0.50   # TP when debit-to-close <= 50% of credit
  stop_multiple_of_credit: 2.0       # stop when debit-to-close >= 2× credit
  # Stop also fires on underlying structure break (whichever first).
  honor_structure_break: true
  # On hit: submit one mleg debit-to-close for the journaled qty. If submit
  # fails, latch EXITING, alert, retry next poll — never mark the journal
  # closed, never cancel a working close to "replace" it.
  # Roll/repair stub: default is CLOSE. Flip execute only when thesis+DTE say roll.
  roll:
    enabled: false
    execute: false              # scaffold never rolls unless this is true
    min_dte_to_consider: 21
    require_thesis_intact: true
    note: "Close unless thesis holds AND DTE >= min_dte_to_consider AND execute is true."

risk:
  risk_per_trade_pct: 0.005     # ~0.5% of equity, sized by max loss
  # max loss per spread = (width × multiplier) − (credit × multiplier)
  max_concurrent: 20            # full_a paper dry-run; day-1 sleeve used 8
  max_portfolio_risk_pct: 0.10  # sum of open max-loss / equity
  one_spread_per_underlying: true
  # Used when the account cannot be fetched (observer --fixture).
  paper_equity_fallback: 100000

calendar:
  # Earnings / FOMC skip. Fill config/calendar.yaml; empty = no skip.
  file: config/calendar.yaml
  skip_earnings: true
  earnings_blackout_days: 3     # skip if earnings within N days of now or expiry
  skip_fomc: true
  fomc_blackout_days: 1

market_data:
  # Stock bars: iex is the free paper feed; sip needs a paid data plan.
  stock_feed: iex
  # Option snapshots: indicative works without OPRA; opra needs a subscription.
  options_feed: indicative
  bar_lookback: 120           # 1Hour timing bars
  daily_bar_lookback: 60      # daily structure / VP / invalidation

broker:
  paper_only: true
  # Encapsulated mleg only — never oco / bracket / oto.
  order_class: mleg
  # See README "Alpaca API notes" and "Exits (options-native)".

heartbeat:
  # Engine writes var/options/heartbeat.json every loop (RTH and off-hours).
  file: heartbeat.json
  interval_seconds: 15
  # US equity options RTH: 9:30–16:00 America/New_York. No extended-hours options.
  stale_after_seconds_rth: 90
  # Off-hours the child still heartbeats with status=idle_off_hours.
  stale_after_seconds_off_hours: 600
  supervise_poll_seconds: 5
  restart_backoff_seconds: [2, 5, 15, 30]

rth:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  # Scan only during RTH. Off-hours: do not submit mleg closes (options
  # do not trade AH). Open spreads are still heartbeated + journaled as
  # overnight_open; structure-break is latched so the first RTH poll runs
  # _manage_exits before any new entries.
  scan_only_rth: true
  manage_exits_off_hours: false   # no AH submits; still flag + latch

loop:
  sleep_seconds_rth: 30
  sleep_seconds_off_hours: 60
